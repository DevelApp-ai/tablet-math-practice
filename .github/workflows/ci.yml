name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          if npm run build > build-output.log 2>&1; then
            echo "Build succeeded"
          else
            {
              echo '### Build failure output (debug capture)'
              echo '```'
              tail -n 150 build-output.log
              echo '```'
            } > comment.md
            cat build-output.log
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true
            exit 1
          fi
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ github.token }}

      - name: Test
        run: npm test
