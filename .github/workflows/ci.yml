name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
        continue-on-error: true

      - name: Type-check
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
        continue-on-error: true

      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NODE_ENV: production
        continue-on-error: true

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
        continue-on-error: true

      - name: Report results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## CI diagnostics (temporary)"
            for f in lint typecheck build test; do
              if [ -f "$f.log" ]; then
                echo
                echo "<details><summary>$f</summary>"
                echo
                echo '```'
                tail -n 150 "$f.log"
                echo '```'
                echo
                echo '</details>'
              fi
            done
          } > comment.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment.md || true
          fi
          cat comment.md

      - name: Enforce outcomes
        if: always()
        run: |
          fail=0
          [ "${{ steps.lint.outcome }}" = "success" ] || { echo "lint failed"; fail=1; }
          [ "${{ steps.typecheck.outcome }}" = "success" ] || { echo "typecheck failed"; fail=1; }
          [ "${{ steps.build.outcome }}" = "success" ] || { echo "build failed"; fail=1; }
          [ "${{ steps.test.outcome }}" = "success" ] || { echo "test failed"; fail=1; }
          exit $fail
