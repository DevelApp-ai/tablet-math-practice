name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > lint.log 2>&1
          LINT_RC=$?
          npm run typecheck > typecheck.log 2>&1
          TSC_RC=$?
          set -e
          {
            echo "### Lint output (exit $LINT_RC)"
            echo '```'
            head -c 20000 lint.log
            echo '```'
            echo "### Type-check output (exit $TSC_RC)"
            echo '```'
            head -c 20000 typecheck.log
            echo '```'
          } > comment.md
          if [ "$LINT_RC" -ne 0 ] || [ "$TSC_RC" -ne 0 ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test
