name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci > npm-ci-output.log 2>&1
          code=$?
          cat npm-ci-output.log
          if [ $code -ne 0 ]; then
            {
              echo "## ❌ npm ci failed (exit $code)"
              echo ""
              echo '```'
              tail -n 60 npm-ci-output.log
              echo '```'
              echo ""
              echo "node: $(node --version), npm: $(npm --version)"
            } > npm-ci-diag.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file npm-ci-diag.md --repo "$GITHUB_REPOSITORY" || echo "comment failed"
            exit $code
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test
